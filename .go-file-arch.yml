version: 1

components:
  cmd:
    in:
      - cmd/**

  filearch:
    in:
      - filearch/**

dependencyRules:
  cmd:
    mayDependOn:
      - filearch

  filearch:
    mayDependOn:
      - filearch

fileNameRules:
  - id: ban-generic-file-names
    files:
      include:
        - "**/*.go"
      exclude:
        - "**/*_test.go"
        - "internal/archlint/**"
    deny:
      fileName:
        equalsAny:
          - helper.go
          - helpers.go
          - common.go
          - misc.go
          - utils.go
    message: "Avoid generic file names. Use a domain-specific name."
